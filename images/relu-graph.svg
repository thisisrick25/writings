<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="30 0 480 400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="30" width="480" height="400" fill="#ffffff"/>
  <text x="260" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">ReLU(x) = max(0, x)</text>

  <!-- axes -->
  <line x1="60" y1="320" x2="480" y2="320" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="270" y1="60" x2="270" y2="320" stroke="#cbd5e1" stroke-width="2"/>

  <!-- axis arrows -->
  <polygon points="480,320 470,315 470,325" fill="#cbd5e1"/>
  <polygon points="270,60 265,70 275,70" fill="#cbd5e1"/>

  <!-- axis labels -->
  <text x="470" y="340" font-size="14" fill="#64748b">x</text>
  <text x="278" y="70" font-size="14" fill="#64748b">y</text>
  <text x="266" y="340" font-size="14" fill="#64748b">0</text>

  <!-- flat part (x < 0): y = 0 -->
  <line x1="60" y1="320" x2="270" y2="320" stroke="#2563eb" stroke-width="3.5"/>
  <!-- rising part (x > 0): y = x, slope 1 -->
  <line x1="270" y1="320" x2="470" y2="120" stroke="#2563eb" stroke-width="3.5"/>

  <!-- kink highlight -->
  <circle cx="270" cy="320" r="6" fill="#ef4444"/>
  <text x="270" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#ef4444">the kink at x = 0</text>

  <!-- region labels -->
  <text x="150" y="305" text-anchor="middle" font-size="13" fill="#2563eb">output = 0</text>
  <text x="150" y="290" text-anchor="middle" font-size="11" fill="#94a3b8">(slope 0)</text>
  <text x="450" y="200" text-anchor="middle" font-size="13" fill="#2563eb">output = x</text>
  <text x="450" y="215" text-anchor="middle" font-size="11" fill="#94a3b8">(slope 1)</text>
</svg>
