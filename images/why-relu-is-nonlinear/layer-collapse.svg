<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="560" height="360" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Why Stacked Linear Layers Collapse</text>

  <!-- TOP ROW: linear layers collapse -->
  <text x="30" y="80" font-size="13" font-weight="600" fill="#64748b">No activation:</text>

  <rect x="30" y="95" width="90" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="75" y="125" text-anchor="middle" font-size="13" fill="#1e40af">W1·x + b1</text>

  <line x1="120" y1="120" x2="165" y2="120" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="165,120 156,115 156,125" fill="#94a3b8"/>

  <rect x="170" y="95" width="90" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="215" y="125" text-anchor="middle" font-size="13" fill="#1e40af">W2·h + b2</text>

  <text x="285" y="125" font-size="22" fill="#94a3b8">=</text>

  <rect x="320" y="95" width="150" height="50" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="395" y="125" text-anchor="middle" font-size="13" fill="#b91c1c">W'·x + b'  (one layer!)</text>

  <text x="30" y="180" font-size="12" fill="#94a3b8">Any depth of linear layers = a single linear layer. No extra power.</text>

  <!-- divider -->
  <line x1="30" y1="205" x2="530" y2="205" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- BOTTOM ROW: ReLU breaks the collapse -->
  <text x="30" y="245" font-size="13" font-weight="600" fill="#64748b">With ReLU:</text>

  <rect x="30" y="260" width="80" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="290" text-anchor="middle" font-size="12" fill="#1e40af">W1·x + b1</text>

  <line x1="110" y1="285" x2="150" y2="285" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="150,285 141,280 141,290" fill="#94a3b8"/>

  <rect x="155" y="260" width="70" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="190" y="290" text-anchor="middle" font-size="13" fill="#15803d">ReLU</text>

  <line x1="225" y1="285" x2="265" y2="285" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="265,285 256,280 256,290" fill="#94a3b8"/>

  <rect x="270" y="260" width="80" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="310" y="290" text-anchor="middle" font-size="12" fill="#1e40af">W2·h + b2</text>

  <text x="365" y="290" font-size="20" fill="#94a3b8">≠</text>

  <rect x="395" y="260" width="135" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="462" y="285" text-anchor="middle" font-size="12" fill="#15803d">cannot be flattened</text>
  <text x="462" y="302" text-anchor="middle" font-size="11" fill="#16a34a">→ genuine depth</text>
</svg>
