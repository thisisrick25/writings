<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="520" height="380" fill="#ffffff"/>
  <text x="260" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">ReLU vs. Sigmoid vs. Tanh</text>

  <!-- axes -->
  <line x1="60" y1="220" x2="480" y2="220" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="270" y1="70" x2="270" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="480,220 470,215 470,225" fill="#cbd5e1"/>
  <polygon points="270,70 265,80 275,80" fill="#cbd5e1"/>
  <text x="490" y="225" font-size="14" fill="#64748b">x</text>
  <text x="278" y="80" font-size="14" fill="#64748b">y</text>

  <!-- ReLU: flat then slope 1 -->
  <line x1="60" y1="220" x2="270" y2="220" stroke="#2563eb" stroke-width="3"/>
  <line x1="270" y1="220" x2="440" y2="90" stroke="#2563eb" stroke-width="3"/>

  <!-- Sigmoid: 0 to 1 curve, centered around y where 0.5 sits above axis -->
  <path d="M 60 210 C 180 208, 230 150, 270 130 C 310 110, 360 92, 480 90" fill="none" stroke="#16a34a" stroke-width="3"/>

  <!-- Tanh: -1 to 1 curve through origin -->
  <path d="M 60 320 C 180 318, 235 250, 270 220 C 305 190, 360 122, 480 120" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <!-- legend -->
  <rect x="70" y="300" width="18" height="4" fill="#2563eb"/>
  <text x="94" y="308" font-size="13" fill="#1a1a1a">ReLU (unbounded, no saturation)</text>
  <rect x="70" y="322" width="18" height="4" fill="#16a34a"/>
  <text x="94" y="330" font-size="13" fill="#1a1a1a">Sigmoid (saturates, vanishing gradient)</text>
  <rect x="290" y="300" width="18" height="4" fill="#f59e0b"/>
  <text x="314" y="308" font-size="13" fill="#1a1a1a">Tanh (saturates both ends)</text>
</svg>
